#############################################
# .env.example - Пример переменных окружения
#############################################

# API ключи (замените на свои)
OPENROUTER_API_KEY=your-openrouter-api-key-here
DEEPSEEK_API_KEY=your-deepseek-api-key-here
NVIDIA_API_KEY=your-nvidia-api-key-here
KIMI_API_KEY=your-kimi-api-key-here
WAFER_API_KEY=your-wafer-api-key-here

# Серверные настройки
FCC_HOST=0.0.0.0
FCC_PORT=8082
FCC_DEBUG=false

# Логирование
FCC_LOG_LEVEL=INFO
FCC_LOG_TO_FILE=true
FCC_LOG_TO_CONSOLE=true

# Кэширование
FCC_ENABLE_CACHE=true
FCC_CACHE_SIZE=100
FCC_CACHE_TTL=3600

# Безопасность
FCC_API_KEY_REQUIRED=true
FCC_RATE_LIMIT_ENABLED=true
FCC_RATE_LIMIT_RPM=60

# Клиентские настройки
FCC_DEFAULT_MODEL=anthropic/claude-3.5-sonnet
FCC_MAX_TOKENS=4096
FCC_TEMPERATURE=0.7
FCC_STREAM=true

#############################################
# admin_config.json - Конфигурация админ-панели
#############################################

{
  "admin": {
    "enabled": true,
    "username": "admin",
    "password": "change-me-please",
    "secret_key": "change-this-to-random-string"
  },
  "ui": {
    "theme": "dark",
    "language": "ru",
    "auto_refresh": true,
    "refresh_interval": 5
  },
  "features": {
    "api_key_management": true,
    "model_selection": true,
    "usage_statistics": true,
    "log_viewer": true
  }
}

#############################################
# Инструкции по использованию
#############################################

# 1. Скопируйте примеры конфигураций:
cp config.yaml.example ~/.config/fcc/config.yaml
cp .env.example ~/.config/fcc/.env
cp admin_config.json.example ~/.config/fcc/admin_config.json

# 2. Отредактируйте конфигурации:
nano ~/.config/fcc/config.yaml
nano ~/.config/fcc/.env

# 3. Перезапустите сервер:
pkill fcc-server
~/start_fcc_server.sh

# 4. Откройте админ-панель:
# http://127.0.0.1:8082/admin

#############################################
# Примечания
#############################################

# - Все конфигурационные файлы должны быть в ~/.config/fcc/
# - API ключи должны храниться только в .env файле
# - Не коммитьте .env файл в git
# - Используйте сложные пароли для админ-панели
# - Регулярно обновляйте конфигурации