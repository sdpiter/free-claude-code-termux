# Free Claude Code - Конфигурация
# Примеры конфигурационных файлов

#############################################
# config.yaml - Основная конфигурация
#############################################

# Серверные настройки
server:
  host: "0.0.0.0"
  port: 8082
  debug: false
  workers: 1

# API настройки
api:
  # Провайдер по умолчанию
  default_provider: "openrouter"

  # Таймауты
  timeout: 60
  max_retries: 3

  # Настройки для разных провайдеров
  providers:
    openrouter:
      base_url: "https://openrouter.ai/api/v1"
      models:
        default: "anthropic/claude-3.5-sonnet"
        fallback: "anthropic/claude-3-haiku"

    deepseek:
      base_url: "https://api.deepseek.com/v1"
      models:
        default: "deepseek-chat"
        fallback: "deepseek-coder"

    nvidia:
      base_url: "https://integrate.api.nvidia.com/v1"
      models:
        default: "meta/llama-3.1-405b-instruct"
        fallback: "meta/llama-3.1-70b-instruct"

# Кэширование
cache:
  enabled: true
  ttl: 3600  # 1 час
  max_size: 100  # МБ

# Логирование
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "~/.config/fcc/logs/server.log"
  max_size: 10485760  # 10 МБ
  backup_count: 5

# Безопасность
security:
  api_key_required: true
  rate_limit:
    enabled: true
    requests_per_minute: 60
  cors:
    enabled: true
    origins: ["*"]

# Клиентские настройки
client:
  timeout: 30
  max_tokens: 4096
  temperature: 0.7
  stream: true

