# ============================================
# Advanced Configuration
# ============================================
advanced_config:
  api:
    provider: "openrouter"
    api_key: "sk-or-v1-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
    base_url: "https://openrouter.ai/api/v1"
    timeout: 300
    retry_attempts: 3
    retry_delay: 5

  model:
    name: "anthropic/claude-3.5-sonnet"
    temperature: 0.7
    max_tokens: 4096
    top_p: 0.9
    frequency_penalty: 0.0
    presence_penalty: 0.0

  server:
    host: "0.0.0.0"
    port: 8082
    debug: false
    workers: 4

  cache:
    enabled: true
    ttl: 3600
    max_size: 1000

  rate_limit:
    enabled: true
    requests_per_minute: 60
    burst_size: 10

  cors:
    enabled: true
    origins:
      - "*"
    methods:
      - GET
      - POST
      - PUT
      - DELETE
      - OPTIONS
    headers:
      - Content-Type
      - Authorization

  logging:
    level: "INFO"
    file: "/data/data/com.termux/files/home/.config/fcc/logs/server.log"
    max_size: "10MB"
    backup_count: 5

  security:
    auth_enabled: false
    admin_password: ""
    allowed_ips: []
    rate_limit_by_ip: true

  performance:
    max_concurrent_requests: 10
    request_timeout: 300
    keepalive_timeout: 75
    max_body_size: "10MB"

# ============================================
# Development Configuration
# ============================================
development_config:
  api:
    provider: "openrouter"
    api_key: "sk-or-v1-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
    base_url: "https://openrouter.ai/api/v1"

  model:
    name: "anthropic/claude-3.5-sonnet"
    temperature: 0.7
    max_tokens: 4096

  server:
    host: "0.0.0.0"
    port: 8082
    debug: true
    reload: true

  cache:
    enabled: false

  rate_limit:
    enabled: false

  logging:
    level: "DEBUG"

# ============================================
# Production Configuration
# ============================================
production_config:
  api:
    provider: "openrouter"
    api_key: "sk-or-v1-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
    base_url: "https://openrouter.ai/api/v1"
    timeout: 300
    retry_attempts: 3

  model:
    name: "anthropic/claude-3.5-sonnet"
    temperature: 0.7
    max_tokens: 4096

  server:
    host: "0.0.0.0"
    port: 8082
    debug: false
    workers: 8

  cache:
    enabled: true
    ttl: 3600
    max_size: 10000

  rate_limit:
    enabled: true
    requests_per_minute: 120
    burst_size: 20

  cors:
    enabled: true
    origins:
      - "https://yourdomain.com"
    methods:
      - GET
      - POST
    headers:
      - Content-Type
      - Authorization

  logging:
    level: "WARNING"
    file: "/data/data/com.termux/files/home/.config/fcc/logs/server.log"
    max_size: "100MB"
    backup_count: 10

  security:
    auth_enabled: true
    admin_password: "your-secure-password"
    allowed_ips: []
    rate_limit_by_ip: true

  performance:
    max_concurrent_requests: 50
    request_timeout: 300
    keepalive_timeout: 75
    max_body_size: "50MB"

# ============================================
# Minimal Configuration
# ============================================
minimal_config:
  api:
    provider: "openrouter"
    api_key: "your-api-key"

  model:
    name: "anthropic/claude-3.5-sonnet"

  server:
    host: "0.0.0.0"
    port: 8082

# ============================================
# Notes
# ============================================
#
# 1. Замените "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx" на ваш реальный API ключ
# 2. Для локальных провайдеров (LM Studio, Ollama) API ключ не требуется
# 3. Порты можно изменить при необходимости
# 4. В production режиме обязательно включите аутентификацию
# 5. Настройте CORS origins для безопасности в production
# 6. Используйте development_config для отладки
# 7. Используйте production_config для боевого использования
# 8. minimal_config содержит только необходимые настройки
#
# ============================================