# ============================================
# OpenRouter Configuration
# ============================================
openrouter_config:
  api:
    provider: "openrouter"
    api_key: "sk-or-v1-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
    base_url: "https://openrouter.ai/api/v1"

  model:
    name: "anthropic/claude-3.5-sonnet"
    temperature: 0.7
    max_tokens: 4096

  server:
    host: "0.0.0.0"
    port: 8082
    debug: false

